# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: slacky

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/slacky
    binary: slacky
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - repository:
      owner: andyhtran
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/andyhtran/slacky
    description: Read-only Slack search for fast context, built for people and agents
    license: MIT
    test: |
      assert_match version.to_s, shell_output("#{bin}/slacky version")

release:
  github:
    owner: andyhtran
    name: slacky
